version: 2.1.0

# Full run (chr1-22) with per-chromosome parallel sumstat processing.
# This tests the new format-sumstat -> filter-variants array flow.
# Based on config.full.noimpute.yaml with sbayesr.impute_n: false.

chromosomes: 1-22

# Use the same reference paths as the standard full-chr smoke config.
ld_reference: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/ld-sbayesr/ukb/band_ukb_10k_hm3
genotypes: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/plink2
genotype_manifest: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/mapfiles/plink2_genodir_genofiles.txt

# New output directory for this test
outdir: /faststorage/project/ibp_pipeline_pgscalculator/pgscalculator/tests/smoke/v2.1-2026-01-11/out_v2parallel_814

slurm:
  account: ibp_pipeline_pgscalculator
  partition: normal

  # Lightweight driver job
  driver: { mem: 1g, cpus: 1, time: '02:00:00' }

  prep: { mem: 16g, cpus: 4, time: '02:00:00' }
  # New: sumstat runs as SLURM array (filter-variants per chromosome)
  sumstat: { mem: 1g, cpus: 1, time: '00:30:00', max_parallel: 22 }
  posteriors: { mem: 20g, cpus: 6, time: '04:00:00', max_parallel: 22 }
  score: { mem: 10g, cpus: 4, time: '01:00:00', max_parallel: 22 }

sbayesr:
  gamma: "0.0,0.01,0.1,1"
  pi: "0.95,0.02,0.02,0.01"
  burn_in: 2000
  chain_length: 10000
  threads: 4
  # Match legacy run seed for best comparability
  seed: 80851
  exclude_mhc: true
  unscale_genotype: true
  # Key switch for this config:
  impute_n: false
