version: 2.1.0

# Full run (chr1-22), but disable GCTB per-SNP N imputation.
# Rationale: when --impute-n is enabled, GCTB can replace the provided N with an
# imputed per-SNP N and then apply its internal N-outlier filter, which can drop
# a large fraction of SNPs and change posteriors/scores.

chromosomes: 1-22

# Use the same reference paths as the standard full-chr smoke config.
ld_reference: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/ld-sbayesr/ukb/band_ukb_10k_hm3
genotypes: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/plink2
genotype_manifest: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/mapfiles/plink2_genodir_genofiles.txt

outdir: /faststorage/project/ibp_pipeline_pgscalculator/pgscalculator/tests/smoke/v2.1-2026-01-11/out_full814

slurm:
  max_parallel: 2
  # Use inline dict style; the wrapper's YAML parser reliably supports this.
  driver: { mem: 2g, cpus: 1, time: '02:00:00' }
  prep: { mem: 10g, cpus: 6, time: '02:00:00' }
  sumstat: { mem: 4g, cpus: 2, time: '02:00:00' }
  posteriors: { mem: 20g, cpus: 6, time: '04:00:00' }
  score: { mem: 10g, cpus: 4, time: '01:00:00' }

sbayesr:
  gamma: "0.0,0.01,0.1,1"
  pi: "0.95,0.02,0.02,0.01"
  burn_in: 2000
  chain_length: 10000
  threads: 4
  # Match legacy run seed for best comparability
  seed: 80851
  exclude_mhc: true
  unscale_genotype: true
  # Key switch for this config:
  impute_n: false
