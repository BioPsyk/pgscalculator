version: 2.1.0

# Parity run for comparison against legacy parameter-search output:
# /home/jesgaaopen/ibp_pipeline_pgscalculator/test-zone/out_parameter_search/sbayesr_default.config/sumstat_805
#
# Goal: match sbayesR/GCTB flags (rsq/p_value/out_freq/thin/threads/seed, and impute_n=false).

chromosomes: 1-22
whichn: totalN

# Same references as the standard full-chr smoke config.
ld_reference: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/ld-sbayesr/ukb/band_ukb_10k_hm3
genotypes: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/plink2
genotype_manifest: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/mapfiles/plink2_genodir_genofiles.txt

# Outdir for this run (can be overridden by the wrapper via -o).
outdir: /faststorage/project/ibp_pipeline_pgscalculator/pgscalculator/tests/smoke/v2.1-2026-01-11/out_paramsearch_805_default

sbayesr:
  gamma: "0.0,0.01,0.1,1"
  pi: "0.95,0.02,0.02,0.01"
  burn_in: 2000
  chain_length: 10000
  out_freq: 10
  p_value: 0.99
  rsq: 0.95
  thin: 10
  threads: 6
  seed: 80851
  exclude_mhc: true
  unscale_genotype: true
  impute_n: false

score_columns: 1 2 5

slurm:
  account: ibp_pipeline_pgscalculator
  partition: normal

  driver: { mem: 2g, cpus: 1, time: '02:00:00' }
  prep: { mem: 16g, cpus: 4, time: '02:00:00' }
  posteriors: { mem: 20g, cpus: 6, time: '04:00:00', max_parallel: 2 }
  score: { mem: 10g, cpus: 4, time: '01:00:00', max_parallel: 2 }

