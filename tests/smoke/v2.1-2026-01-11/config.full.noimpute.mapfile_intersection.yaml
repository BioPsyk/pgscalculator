version: 2.1.0

# Full run (chr1-22), mapfile-intersection flow, and GCTB per-SNP N imputation disabled.
# Uses the new config keys (input/outdir/genodir/genofile/lddir).

chromosomes: 1-22

input: /faststorage/project/ibp_pipeline_cleansumstats/raw_library/sumstat_clean_library/version_1.12.0
lddir: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/ld-sbayesr/ukb/band_ukb_10k_hm3
genodir: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/plink2
genofile: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/mapfiles/plink2_genodir_genofiles.txt

outdir: /faststorage/project/ibp_pipeline_pgscalculator/pgscalculator/tests/smoke/v2.1-2026-01-11/out_full814_mapfile_intersection

slurm:
  account: ibp_pipeline_pgscalculator
  partition: normal
  driver: { mem: 2g, cpus: 1, time: '02:00:00' }
  prep: { mem: 16g, cpus: 1, time: '02:00:00', max_parallel: 22 }
  sumstat: { mem: 3g, cpus: 2, time: '02:00:00', max_parallel: 22 }
  posteriors: { mem: 20g, cpus: 6, time: '04:00:00', max_parallel: 22 }
  score: { mem: 10g, cpus: 4, time: '01:00:00', max_parallel: 22 }

sbayesr:
  gamma: "0.0,0.01,0.1,1"
  pi: "0.95,0.02,0.02,0.01"
  burn_in: 2000
  chain_length: 10000
  threads: 4
  # Match legacy run seed for best comparability
  seed: 80851
  exclude_mhc: true
  unscale_genotype: true
  # Key switch for this config:
  impute_n: false
