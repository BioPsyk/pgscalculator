# v2.2 smoke: LDpred2 only (chr 22 subset for speed)
ld_reference: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/ld-sbayesr/ukb/band_ukb_10k_hm3
genotypes: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/plink2
genotype_manifest: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/mapfiles/plink2_genodir_genofiles.txt
genotype_build: GRCh37
liftover_reference: /faststorage/project/ibp_pipeline_cleansumstats/cleansumstats/out_dbsnp/dbsnp_cleansumstat_reference_GRCh37_GRCh38.txt.gz

outdir: /faststorage/project/ibp_pipeline_pgscalculator/pgscalculator/tests/smoke/v2.2-2026-05-26/out_ldpred2

methods: [ldpred2]

whichn: totalN
chromosomes: 22

filters: {}

plink:
  threads: 4

ldpred2:
  mode: auto
  ld_variant_set: hm3
  ld_dir: __LDPRED2_LD_DIR__
  threads: 4
  seed: 1

score_columns: 1 2 5

benchmark:
  maf_threshold: 0.05
  indep_pairwise: [250, 50, 0.25]

slurm:
  account: ibp_pipeline_pgscalculator
  partition: normal
  driver: { mem: 5g, cpus: 1, time: '02:00:00' }
  prep: { mem: 16g, cpus: 4, time: '02:00:00' }
  sumstat: { mem: 1g, cpus: 1, time: '00:30:00', max_parallel: 1 }
  weights_ldpred2: { mem: 64g, cpus: 16, time: '04:00:00' }
  weights_benchmark: { mem: 2g, cpus: 2, time: '00:30:00', max_parallel: 1 }
  score: { mem: 10g, cpus: 4, time: '01:00:00', max_parallel: 1 }
  finalize: { mem: 16g, cpus: 1, time: '01:00:00' }
