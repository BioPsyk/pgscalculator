# v2.2 genome-wide: sBayesR + LDpred2, all chromosomes, image 0.7.0
ld_reference: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/ld-sbayesr/ukb/band_ukb_10k_hm3
genotypes: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/plink2
genotype_manifest: /faststorage/project/ibp_migration_opengdk/PROJECT_pgscalculator/pgscalculator/references/genotypes_test/mapfiles/plink2_genodir_genofiles.txt
genotype_build: GRCh37
liftover_reference: /faststorage/project/ibp_pipeline_cleansumstats/cleansumstats/out_dbsnp/dbsnp_cleansumstat_reference_GRCh37_GRCh38.txt.gz

outdir: /faststorage/project/ibp_pipeline_pgscalculator/pgscalculator/tests/smoke/v2.2-2026-05-26/out_both_gw

methods: [sbayesr, ldpred2]

whichn: totalN
chromosomes: 1-22

filters: {}

plink:
  threads: 4

sbayesr:
  gamma: "0.0,0.01,0.1,1"
  pi: "0.95,0.02,0.02,0.01"
  burn_in: 2000
  chain_length: 10000
  threads: 4
  seed: 12345
  exclude_mhc: true

ldpred2:
  mode: auto
  ld_variant_set: hm3
  ld_dir: /faststorage/project/ibp_pipeline_pgscalculator/pgscalculator/references/ld-ldpred2/hm3
  threads: 16
  seed: 1

score_columns: 1 2 5

benchmark:
  maf_threshold: 0.05
  indep_pairwise: [250, 50, 0.25]

slurm:
  account: ibp_pipeline_pgscalculator
  partition: normal
  driver: { mem: 5g, cpus: 1, time: '24:00:00' }
  prep: { mem: 24g, cpus: 4, time: '08:00:00', max_parallel: 22 }
  sumstat: { mem: 4g, cpus: 1, time: '01:00:00', max_parallel: 6 }
  weights_sbayesr: { mem: 24g, cpus: 6, time: '06:00:00', max_parallel: 6 }
  weights_ldpred2: { mem: 64g, cpus: 16, time: '08:00:00' }
  weights_benchmark: { mem: 4g, cpus: 2, time: '01:00:00', max_parallel: 6 }
  score: { mem: 12g, cpus: 4, time: '02:00:00', max_parallel: 6 }
  finalize: { mem: 24g, cpus: 1, time: '02:00:00' }
